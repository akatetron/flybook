plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.flybook.nativebridge'
version = '0.1.0'

android {
  namespace "app.flybook.nativebridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Apache-2.0. Reads PDF text with positions and font sizes.
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
